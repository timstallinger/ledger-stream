apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ledger-stream
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ledger-stream
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - "-c"
            - "shared_buffers=64MB"
            - "-c"
            - "work_mem=4MB"
            - "-c"
            - "maintenance_work_mem=32MB"
            - "-c"
            - "max_connections=60"
            - "-c"
            - "lock_timeout=3s"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: ledger
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-stream-db-creds
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-stream-db-creds
                  key: db-pass
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 96Mi
              cpu: 250m
            limits:
              memory: 320Mi
              cpu: 500m
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d ledger"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d ledger"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d ledger"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run-pg
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/01-init-keycloak-db.sql
              subPath: init-keycloak-db.sql
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: run-pg
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init-sql
          configMap:
            name: postgres-init-sql
