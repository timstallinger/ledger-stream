global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: ledger-stream-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:9000']
