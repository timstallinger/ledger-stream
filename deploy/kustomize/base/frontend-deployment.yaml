apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ledger-stream
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ledger-stream
  labels:
    app: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/timstallinger/ledger-stream-frontend:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VITE_API_BASE_URL
              value: http://app:8080
            - name: VITE_OIDC_AUTHORITY
              value: http://keycloak:8080/realms/ledger-stream
            - name: VITE_OIDC_CLIENT_ID
              value: ledger-stream-spa
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 24Mi
              cpu: 20m
            limits:
              memory: 48Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /config.js
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            # Required for runtime /tmp/config.js generation under readOnlyRootFilesystem
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
