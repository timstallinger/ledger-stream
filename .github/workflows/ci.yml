name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify (Temurin 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run unit, ArchUnit and Testcontainers tests
        run: ./mvnw -B verify

      - name: Emit failing test annotations on failure
        if: failure()
        run: |
          for f in */target/surefire-reports/*.txt */target/failsafe-reports/*.txt; do
            if [ -f "$f" ] && grep -qE '(FAILURE!|ERROR!)' "$f"; then
              MSG=$(head -n 15 "$f" | tr '\n' ' ')
              echo "::error title=Test failure in $f::$MSG"
            fi
          done

      - name: Verify Failsafe integration tests actually executed
        run: |
          SUMMARY="app/target/failsafe-reports/failsafe-summary.xml"
          if [ ! -f "$SUMMARY" ]; then
            echo "ERROR: Missing $SUMMARY — integration tests did not run!"
            exit 1
          fi
          cat "$SUMMARY"
          COMPLETED=$(sed -n 's/.*<completed>\([0-9]*\)<\/completed>.*/\1/p' "$SUMMARY")
          ERRORS=$(sed -n 's/.*<errors>\([0-9]*\)<\/errors>.*/\1/p' "$SUMMARY")
          FAILURES=$(sed -n 's/.*<failures>\([0-9]*\)<\/failures>.*/\1/p' "$SUMMARY")
          echo "Failsafe ITs: completed=${COMPLETED}, errors=${ERRORS}, failures=${FAILURES}"
          if [ -z "$COMPLETED" ] || [ "$COMPLETED" -lt 1 ]; then
            echo "ERROR: Expected at least 1 integration test to execute."
            exit 1
          fi

      - name: Verify Schema Evolution & Compatibility Check IT executed
        env:
          EXPECTED_SCHEMA_EVO_TESTS: "4"
        run: |
          REPORT="app/target/failsafe-reports/TEST-io.ledgerstream.app.SchemaEvolutionIT.xml"
          if [ ! -f "$REPORT" ]; then
            echo "ERROR: Missing $REPORT — Schema compatibility check did not run!"
            exit 1
          fi
          HEADER=$(grep -m1 '<testsuite ' "$REPORT")
          echo "SchemaEvolutionIT report: $HEADER"
          TESTS=$(echo "$HEADER" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
          SKIPPED=$(echo "$HEADER" | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p')
          ERRORS=$(echo "$HEADER" | sed -n 's/.*errors="\([0-9]*\)".*/\1/p')
          FAILURES=$(echo "$HEADER" | sed -n 's/.*failures="\([0-9]*\)".*/\1/p')
          echo "SchemaEvolutionIT: tests=${TESTS} (expected=${EXPECTED_SCHEMA_EVO_TESTS}), skipped=${SKIPPED}, errors=${ERRORS}, failures=${FAILURES}"
          if [ -z "$TESTS" ] || [ "$TESTS" -ne "$EXPECTED_SCHEMA_EVO_TESTS" ] || [ "${SKIPPED:-1}" -ne 0 ] || [ "${ERRORS:-1}" -ne 0 ] || [ "${FAILURES:-1}" -ne 0 ]; then
            echo "ERROR: SchemaEvolutionIT compatibility checks did not match expected count or had skips/errors!"
            exit 1
          fi
          for REQUIRED_TEST in \
            "direction1_v2ConsumerReadsV1DataAndResolvesNonNullDefault" \
            "direction2_v1ConsumerReadsV2DataAndPayloadSchemaVersionMatchesV2RegistryId"; do
            if ! grep -q "name=\"${REQUIRED_TEST}\"" "$REPORT"; then
              echo "ERROR: Missing required bidirectional test case: ${REQUIRED_TEST}"
              exit 1
            fi
            echo "Verified bidirectional test in report: ${REQUIRED_TEST}"
          done

  frontend-verify:
    name: Frontend Verify (Node 24 + TS strict)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck (tsc + vue-tsc strict), Lint, Test and Build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          if grep -rn ": any" src/; then
            echo "ERROR: Explicit 'any' type found in frontend/src!"
            exit 1
          fi
          if grep -rn "as unknown" src/; then
            echo "ERROR: 'as unknown as X' cast found in frontend/src!"
            exit 1
          fi

  gitops-policy-gate:
    name: GitOps & Kustomize Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render Kustomize overlays and enforce GitOps & Secret hygiene
        run: |
          kubectl kustomize deploy/kustomize/overlays/local > /tmp/local.yaml
          kubectl kustomize deploy/kustomize/overlays/prod > /tmp/prod.yaml
          echo "Rendered overlays successfully: local=$(wc -l < /tmp/local.yaml) lines, prod=$(wc -l < /tmp/prod.yaml) lines"

          # Enforce zero plaintext Kubernetes Secret manifests in deploy/
          if grep -rnE '^kind:[[:space:]]*Secret$' deploy/; then
            echo "ERROR: Plaintext Secret manifest found in deploy/ — use SealedSecret only!"
            exit 1
          fi

          # Enforce zero imperative cluster applies in CI workflows (ArgoCD GitOps pull-only)
          if grep -rnE 'kubec[t]l[[:space:]]+apply' .github/workflows/; then
            echo "ERROR: Forbidden imperative apply command found in workflow — deployments must go through ArgoCD!"
            exit 1
          fi

          # Enforce zero :latest tags in deploy/
          if grep -rnE 'image:.*:latest' deploy/; then
            echo "ERROR: Forbidden ':latest' image tag found in deploy/ — pin immutable tags or digests!"
            exit 1
          fi

  container-supply-chain:
    name: GHCR Digest Push, Cosign Sign & CycloneDX SBOM Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-verify, frontend-verify, gitops-policy-gate]
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-supply-chain-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign and Syft
        run: |
          curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          curl -fsSL https://github.com/anchore/syft/releases/download/v1.22.0/syft_1.22.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin syft
          chmod +x /usr/local/bin/syft

      - name: Build and push app image (immutable sha tag, no latest)
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ledger-stream-app:sha-${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push frontend image (immutable sha tag, no latest)
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ledger-stream-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push keycloak image (immutable sha tag, no latest)
        id: build-keycloak
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ledger-stream-keycloak:sha-${{ github.sha }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      - name: Generate CycloneDX SBOM, Cosign keyless sign, attest & verify gate
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          APP_DIGEST: ${{ steps.build-app.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
          KEYCLOAK_DIGEST: ${{ steps.build-keycloak.outputs.digest }}
        run: |
          set -euo pipefail
          for ENTRY in \
            "ledger-stream-app@${APP_DIGEST}" \
            "ledger-stream-frontend@${FRONTEND_DIGEST}" \
            "ledger-stream-keycloak@${KEYCLOAK_DIGEST}"; do
            REF="ghcr.io/${OWNER}/${ENTRY}"
            NAME="${ENTRY%%@*}"
            echo "=== Supply Chain: ${REF} ==="

            # 1. Generate CycloneDX SBOM
            syft "${REF}" -o "cyclonedx-json=/tmp/${NAME}.cdx.json"

            # 2. Keyless Cosign image signature (Fulcio + Rekor)
            cosign sign --yes "${REF}"

            # 3. Attach signed CycloneDX SBOM attestation
            cosign attest --yes --predicate "/tmp/${NAME}.cdx.json" --type cyclonedx "${REF}"

            # 4. Mandatory verification gate (fails pipeline on any tampering or missing attestation)
            cosign verify "${REF}" \
              --certificate-identity-regexp="https://github.com/${REPO}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

            cosign verify-attestation "${REF}" \
              --type cyclonedx \
              --certificate-identity-regexp="https://github.com/${REPO}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" > /dev/null

            echo "VERIFIED_DIGEST=${REF}"
          done
