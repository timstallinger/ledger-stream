spring:
  application:
    name: ledger-stream
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger_local_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      connection-init-sql: "SET lock_timeout = '3s'"
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ledger-stream}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ledger-stream/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        max.poll.interval.ms: 300000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

ledger:
  admin:
    enabled: ${LEDGER_ADMIN_ENABLED:false}
  security:
    expected-audience: ${OIDC_EXPECTED_AUDIENCE:ledger-stream-api}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  kafka:
    topics:
      ledger-events: ${LEDGER_EVENTS_TOPIC:ledger.events}
      ledger-events-dlq: ${LEDGER_EVENTS_DLQ_TOPIC:ledger.events.dlq}
    consumer:
      enabled: ${KAFKA_CONSUMER_ENABLED:true}
      group-id: ${KAFKA_CONSUMER_GROUP_ID:ledger-stream-projection}
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:6}
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:5}
      initial-delay-ms: ${KAFKA_RETRY_INITIAL_DELAY_MS:1000}
      max-delay-ms: ${KAFKA_RETRY_MAX_DELAY_MS:30000}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:500}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:200}
      publish-timeout-ms: ${OUTBOX_RELAY_PUBLISH_TIMEOUT_MS:10000}
      max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:10}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
