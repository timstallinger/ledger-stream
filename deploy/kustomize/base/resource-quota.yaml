apiVersion: v1
kind: ResourceQuota
metadata:
  name: ledger-stream-budget
  namespace: ledger-stream
spec:
  hard:
    # Nominal pod requests (= real budget from F1 1.5-vCPU anon peaks): 1500m CPU / 1728Mi RAM.
    # Quota hard values = nominal budget + surge headroom for one RollingUpdate app pod (500m / 512Mi,
    # limits 1000m / 640Mi) in the prod overlay. Hard is NOT a second budget.
    requests.cpu: 2000m
    requests.memory: 2304Mi
    limits.cpu: 5000m
    limits.memory: 3584Mi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ledger-stream-defaults
  namespace: ledger-stream
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
        cpu: 50m
      default:
        memory: 256Mi
        cpu: 250m
      min:
        memory: 16Mi
        cpu: 10m
      max:
        memory: 640Mi
        cpu: 1500m
