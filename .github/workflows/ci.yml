name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify (Temurin 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run unit, ArchUnit and Testcontainers tests
        run: ./mvnw -B verify

      - name: Verify Failsafe integration tests actually executed
        run: |
          SUMMARY="app/target/failsafe-reports/failsafe-summary.xml"
          if [ ! -f "$SUMMARY" ]; then
            echo "ERROR: Missing $SUMMARY — integration tests did not run!"
            exit 1
          fi
          cat "$SUMMARY"
          COMPLETED=$(sed -n 's/.*<completed>\([0-9]*\)<\/completed>.*/\1/p' "$SUMMARY")
          ERRORS=$(sed -n 's/.*<errors>\([0-9]*\)<\/errors>.*/\1/p' "$SUMMARY")
          FAILURES=$(sed -n 's/.*<failures>\([0-9]*\)<\/failures>.*/\1/p' "$SUMMARY")
          echo "Failsafe ITs: completed=${COMPLETED}, errors=${ERRORS}, failures=${FAILURES}"
          if [ -z "$COMPLETED" ] || [ "$COMPLETED" -lt 1 ]; then
            echo "ERROR: Expected at least 1 integration test to execute."
            exit 1
          fi

      - name: Verify Schema Evolution & Compatibility Check IT executed
        env:
          EXPECTED_SCHEMA_EVO_TESTS: "4"
        run: |
          REPORT="app/target/failsafe-reports/TEST-io.ledgerstream.app.SchemaEvolutionIT.xml"
          if [ ! -f "$REPORT" ]; then
            echo "ERROR: Missing $REPORT — Schema compatibility check did not run!"
            exit 1
          fi
          HEADER=$(grep -m1 '<testsuite ' "$REPORT")
          echo "SchemaEvolutionIT report: $HEADER"
          TESTS=$(echo "$HEADER" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
          SKIPPED=$(echo "$HEADER" | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p')
          ERRORS=$(echo "$HEADER" | sed -n 's/.*errors="\([0-9]*\)".*/\1/p')
          FAILURES=$(echo "$HEADER" | sed -n 's/.*failures="\([0-9]*\)".*/\1/p')
          echo "SchemaEvolutionIT: tests=${TESTS} (expected=${EXPECTED_SCHEMA_EVO_TESTS}), skipped=${SKIPPED}, errors=${ERRORS}, failures=${FAILURES}"
          if [ -z "$TESTS" ] || [ "$TESTS" -ne "$EXPECTED_SCHEMA_EVO_TESTS" ] || [ "${SKIPPED:-1}" -ne 0 ] || [ "${ERRORS:-1}" -ne 0 ] || [ "${FAILURES:-1}" -ne 0 ]; then
            echo "ERROR: SchemaEvolutionIT compatibility checks did not match expected count or had skips/errors!"
            exit 1
          fi
          for REQUIRED_TEST in \
            "direction1_v2ConsumerReadsV1DataAndResolvesNonNullDefault" \
            "direction2_v1ConsumerReadsV2DataAndPayloadSchemaVersionMatchesV2RegistryId"; do
            if ! grep -q "name=\"${REQUIRED_TEST}\"" "$REPORT"; then
              echo "ERROR: Missing required bidirectional test case: ${REQUIRED_TEST}"
              exit 1
            fi
            echo "Verified bidirectional test in report: ${REQUIRED_TEST}"
          done

  frontend-verify:
    name: Frontend Verify (Node 24 + TS strict)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck (tsc + vue-tsc strict), Lint, Test and Build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          if grep -rn ": any" src/; then
            echo "ERROR: Explicit 'any' type found in frontend/src!"
            exit 1
          fi
          if grep -rn "as unknown" src/; then
            echo "ERROR: 'as unknown as X' cast found in frontend/src!"
            exit 1
          fi
