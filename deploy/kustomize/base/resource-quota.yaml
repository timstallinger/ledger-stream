apiVersion: v1
kind: ResourceQuota
metadata:
  name: ledger-stream-budget
  namespace: ledger-stream
spec:
  hard:
    # Hard enforcement of the 1.5 GiB / 1.5 vCPU working-set budget on requests (M2 measured anon = 1515.87 MiB).
    # Sum of container limits is intentionally higher (~2864 MiB = 1.86x overcommit) to accommodate reclaimable
    # PostgreSQL/Kafka page cache and non-simultaneous JVM bursts (documented in README.md).
    requests.memory: 1536Mi
    requests.cpu: 1500m
    limits.memory: 2944Mi
    limits.cpu: 4000m
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ledger-stream-defaults
  namespace: ledger-stream
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
        cpu: 50m
      default:
        memory: 256Mi
        cpu: 250m
      min:
        memory: 16Mi
        cpu: 10m
      max:
        memory: 640Mi
        cpu: 1500m
