apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ledger-stream

resources:
  - ../../base

# Delta-only local overlay overrides
configMapGenerator:
  - name: ledger-stream-config
    namespace: ledger-stream
    behavior: merge
    literals:
      - LEDGER_ADMIN_ENABLED=false
      - SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL=FULL
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend:8080

patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
