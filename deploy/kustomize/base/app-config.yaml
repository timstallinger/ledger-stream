apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-stream-config
  namespace: ledger-stream
data:
  LEDGER_ADMIN_ENABLED: "false"
  SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: "FULL"
  LEDGER_EVENTS_TOPIC: "ledger.events"
  LEDGER_EVENTS_DLQ_TOPIC: "ledger.events.dlq"
  OUTBOX_RELAY_BATCH_SIZE: "500"
  OUTBOX_RELAY_FIXED_DELAY_MS: "200"
  OUTBOX_RELAY_MAX_ATTEMPTS: "10"
  KAFKA_CONSUMER_CONCURRENCY: "6"
  KAFKA_RETRY_MAX_ATTEMPTS: "5"
  DB_POOL_MAX_SIZE: "20"
  OIDC_EXPECTED_AUDIENCE: "ledger-stream-api"
  OIDC_ISSUER_URI: "http://keycloak:8080/realms/ledger-stream"
  OIDC_JWK_SET_URI: "http://keycloak:8080/realms/ledger-stream/protocol/openid-connect/certs"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:8080"
