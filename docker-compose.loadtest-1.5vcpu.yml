# Optional Compose override for M1 1.5-vCPU budget benchmark.
# Enforces exact 1.50 vCPU sum across all 8 containers (app 0.6 + postgres 0.35 + kafka 0.25 +
# schema-registry 0.15 + keycloak 0.10 + frontend/prometheus/grafana 0.05 = 1.50 vCPU) while
# keeping all memory limits identical to docker-compose.yml.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    cpus: 0.35
  kafka:
    cpus: 0.25
    healthcheck:
      retries: 60
  schema-registry:
    cpus: 0.15
    healthcheck:
      retries: 80
  keycloak:
    cpus: 0.10
    healthcheck:
      retries: 180
  app:
    cpus: 0.60
    environment:
      JAVA_OPTS: "${APP_JAVA_OPTS:--XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:NativeMemoryTracking=summary}"
    healthcheck:
      retries: 90
  frontend:
    cpus: 0.02
  prometheus:
    cpus: 0.015
  grafana:
    cpus: 0.015
