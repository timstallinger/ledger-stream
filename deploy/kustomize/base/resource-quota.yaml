apiVersion: v1
kind: ResourceQuota
metadata:
  name: ledger-stream-budget
  namespace: ledger-stream
spec:
  hard:
    # Realistic budget derived directly from F1 1.5-vCPU 100k cgroup memory.stat anon peaks (sum = 1637.44 MiB).
    # Pod requests sum to 1728Mi RAM (quota 1792Mi = 1.75 GiB) and exactly 1500m CPU (1.50 vCPU).
    # Limits sum to 2864Mi (1.66x overcommit): limits are upper bounds for reclaimable page cache and
    # non-simultaneous JVM bursts, not reservations.
    requests.memory: 1792Mi
    requests.cpu: 1500m
    limits.memory: 2944Mi
    limits.cpu: 4000m
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ledger-stream-defaults
  namespace: ledger-stream
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
        cpu: 50m
      default:
        memory: 256Mi
        cpu: 250m
      min:
        memory: 16Mi
        cpu: 10m
      max:
        memory: 640Mi
        cpu: 1500m
