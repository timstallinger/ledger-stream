spring:
  application:
    name: ledger-stream
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger_local_dev}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8080}

ledger:
  kafka:
    topics:
      ledger-events: ${LEDGER_EVENTS_TOPIC:ledger.events}
      ledger-events-dlq: ${LEDGER_EVENTS_DLQ_TOPIC:ledger.events.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
