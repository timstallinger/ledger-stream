apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ledger-stream

resources:
  - namespace.yaml
  - resource-quota.yaml
  - app-config.yaml
  - sealed-secrets.yaml
  - network-policies.yaml
  - postgres-statefulset.yaml
  - kafka-statefulset.yaml
  - schema-registry-deployment.yaml
  - keycloak-deployment.yaml
  - app-deployment.yaml
  - frontend-deployment.yaml
  - prometheus-deployment.yaml
  - grafana-deployment.yaml

configMapGenerator:
  - name: postgres-init-sql
    files:
      - init-keycloak-db.sql=files/init-keycloak-db.sql
  - name: keycloak-realm-template
    files:
      - realm-export.json=files/realm-export.json
  - name: prometheus-config
    files:
      - prometheus.yml=files/prometheus.yml
  - name: grafana-provisioning
    files:
      - prometheus.yml=files/grafana-datasource.yml
      - dashboards.yml=files/grafana-dashboards.yml
  - name: grafana-dashboards
    files:
      - ledger-stream.json=files/ledger-stream.json
generatorOptions:
  disableNameSuffixHash: true
