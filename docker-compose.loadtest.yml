# Optional Compose override for Phase 10 unconstrained benchmark & M2/M3 diagnostics.
# Keeps all memory limits (mem_limit) 100% identical to docker-compose.yml while exposing
# PostgreSQL on loopback 5433, enabling JVM NativeMemoryTracking=summary (M3), and
# unlocking CPU caps so 6 Kafka partitions, consumer concurrency=6 and 32 HTTP threads run in parallel.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    cpus: 4.0
  kafka:
    cpus: 2.0
  schema-registry:
    cpus: 1.0
  keycloak:
    cpus: 2.0
  app:
    cpus: 6.0
    environment:
      JAVA_OPTS: "${APP_JAVA_OPTS:--XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:NativeMemoryTracking=summary}"
  prometheus:
    cpus: 1.0
  grafana:
    cpus: 1.0
