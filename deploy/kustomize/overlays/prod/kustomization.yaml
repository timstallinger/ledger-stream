apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ledger-stream

resources:
  - ../../base

# Production delta: RollingUpdate for app (base & local stay Recreate).
# With replicas=1, maxSurge=25% rounds up to 1 and maxUnavailable=25% rounds down to 0,
# so Kubernetes starts and readiness-checks the new app Pod BEFORE terminating the old one.
patches:
  - path: app-rolling-update-patch.yaml

# Delta-only production overlay: hard-pins admin=false, FULL schema compatibility,
# and immutable GHCR image digests (updated after signed GHCR build; never :latest).
configMapGenerator:
  - name: ledger-stream-config
    namespace: ledger-stream
    behavior: merge
    literals:
      - LEDGER_ADMIN_ENABLED=false
      - SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL=FULL

# Immutable digest pinning (no :latest); images signed with Cosign + CycloneDX SBOM attestation
images:
  - name: ghcr.io/timstallinger/ledger-stream-app
    digest: sha256:597ae35c6c5acd76aafd1a0a3dbf40be8ef16b42e98f21495fb1288ada69d0f0
  - name: ghcr.io/timstallinger/ledger-stream-frontend
    digest: sha256:4f0d0405f92400ce54fe321e13b61c0ec167cd2eef553dc3dc82eb72ce63438f
  - name: ghcr.io/timstallinger/ledger-stream-keycloak
    digest: sha256:51132d1ab47a498d18ca67af5750f9373c1506fd1065c604dd5e5740e32ed6bf
