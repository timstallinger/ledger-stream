apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ledger-stream
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/timstallinger/ledger-stream.git
    targetRevision: main
    path: deploy/kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ledger-stream
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
